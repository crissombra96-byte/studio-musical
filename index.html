<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12161a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Estudio Musical</title>
<style>
:root{--bg:#12161a;--pn:#1b2228;--ln:#2c353d;--tx:#e8e4da;--mu:#98a0a6;--br:#d4a84b;--al:#e0674f;--me:#d4a84b;--ba:#6fa3aa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
h1,h2,.tt{font-family:Georgia,'Times New Roman',serif;font-weight:600}
header{padding:18px 18px 6px}
header h1{margin:0;font-size:26px;text-transform:capitalize}
header p{margin:2px 0 0;color:var(--mu);font-size:14px}
main{flex:1;overflow:auto;padding:10px 14px 24px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--pn);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mu);font-size:14px}
nav button.on{color:var(--br);box-shadow:inset 0 2px 0 var(--br)}
.card{display:flex;gap:12px;align-items:flex-start;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:13px;margin:0 0 10px}
.card .tt{font-size:18px}.card small{color:var(--mu);display:block}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.alta{background:var(--al)}.media{background:var(--me)}.baja{background:var(--ba)}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
.btn{background:var(--br);color:#1a1405;border:0;border-radius:8px;padding:12px 16px;font-size:16px;font-weight:600}
.btn.s{background:var(--pn);color:var(--tx);border:1px solid var(--ln)}
.btn.d{background:none;color:var(--al);border:1px solid var(--al)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.days{display:flex;gap:4px;margin-top:8px}
.days button{flex:1;padding:9px 0;border-radius:6px;border:1px solid var(--ln);background:none;color:var(--mu);font-size:13px}
.days button.on{background:var(--br);color:#1a1405;border-color:var(--br);font-weight:700}
.days button.hoy{border-color:var(--tx)}
.modal{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 30px;z-index:5}
label{display:block;margin:14px 0 4px;color:var(--mu);font-size:14px}
input[type=text],input[type=date],textarea,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit}
#v{position:fixed;inset:0;background:#fff;z-index:9;display:flex;flex-direction:column}
#vb{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--pn)}
#vb .tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#vb button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;font-size:15px}
#vb button.on{border-color:var(--br);color:var(--br)}
#pages{scrollbar-width:none;flex:1;overflow:auto;display:flex;gap:4px;touch-action:pan-x pan-y}
.pw{position:relative;margin:auto 0;flex:none}.pw:first-child{margin-left:auto}.pw:last-child{margin-right:auto}.pw canvas{display:block}
.ov{position:absolute;left:0;top:0;pointer-events:none}
#pages.an .ov{pointer-events:auto;touch-action:none}#pages.an.mano .ov{pointer-events:none}#pages.an.sd .ov{touch-action:pan-x pan-y}
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--br);background:rgba(212,168,75,.35);padding:0}
#ab{display:flex;flex-wrap:nowrap;overflow-x:auto;align-items:center;gap:4px;padding:6px 8px;background:var(--pn);border-top:1px solid var(--ln)}
#ab button{flex:none;white-space:nowrap;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 9px;font-size:14px}#ab button.on{border-color:var(--br);color:var(--br)}
#ab .sw{width:28px;height:28px;border-radius:50%;padding:0}#ab .sw.on{border:3px solid var(--tx)}#sws{display:flex;gap:6px;flex:none}
#nt{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--pn);border-top:1px solid var(--ln);padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
#pages.inv .pg{filter:invert(.92) hue-rotate(180deg)}
#pg{color:var(--mu);font-size:14px;min-width:64px;text-align:center}
#vf{padding:2px 16px calc(2px + env(safe-area-inset-bottom));background:var(--pn);border-top:1px solid var(--ln)}#vf input{width:100%;accent-color:var(--br);margin:8px 0}.li{display:flex;gap:6px}.li button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 11px;font-size:15px}
.hide{display:none!important}#pages::-webkit-scrollbar{display:none}
</style></head><body>
<header><h1 id="h1"></h1><p id="h2"></p></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal" class="modal hide"></div>
<div id="v" class="hide">
 <div id="vb"><button id="vx">✕</button><span class="tt" id="vt"></span><button id="vo" class="hide">✎ Anotar</button><button id="vh" title="Media página">½</button><button id="vz">×1</button><button id="vm"></button><button id="vp">‹</button><span id="pg"></span><button id="vn">›</button></div>
 <div id="ab" class="hide"><button data-t="l">Lápiz</button><button data-t="h">Resaltador</button><button data-t="g">Goma</button><button data-t="n">Nota</button><button data-t="m">Mover</button><span id="sws"></span><button id="agr"></button><button id="aun">Deshacer</button><button id="adi"></button><button id="aoc"></button></div>
 <div id="pages"></div>
 <div id="vf"><input type="range" id="vsl" min="1" max="1" value="1"></div>
</div>
<div id="nt" class="hide"><textarea id="ntx" rows="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit"></textarea><div class="row"><button class="btn" id="nts">Guardar</button><button class="btn d" id="ntd">Borrar</button><button class="btn s" id="ntc">Cerrar</button></div></div>
<script src="pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const MAXP=10,DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],ORD=[1,2,3,4,5,6,0],PRI={alta:0,media:1,baja:2};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,obras=[],listas=[],pdfIds=new Set(),tab='est',sub='obras',gf='',se='hoy',oq='';
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtF=f=>{const [y,m,d]=f.split('-');return new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short',year:'numeric'})};
const rq=(s,m,f)=>new Promise((ok,no)=>{const r=f(db.transaction(s,m).objectStore(s));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

async function init(){
 db=await new Promise((ok,no)=>{const r=indexedDB.open('estudio',3);r.onupgradeneeded=()=>{const d=r.result,c=(n,o)=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,o)};c('obras',{keyPath:'id',autoIncrement:true});c('pdfs');c('notas',{keyPath:'obra'});c('listas',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
 await load();draw();
}
async function load(){
 obras=await rq('obras','readonly',s=>s.getAll());
 pdfIds=new Set(await rq('pdfs','readonly',s=>s.getAllKeys()));
 listas=(await rq('listas','readonly',s=>s.getAll())).map(l=>({...l,obras:l.obras||[]}));
}
const sortO=a=>a.sort((x,y)=>PRI[x.prioridad]-PRI[y.prioridad]||x.titulo.localeCompare(y.titulo));
const PL={alta:'Alta',media:'Media',baja:'Baja'};

function draw(){
 const now=new Date(),hoy=now.getDay(),m=$('#main');
 $('#h1').textContent={est:se==='lis'?'Listas':'Hoy',org:'Organizar',aju:'Ajustes'}[tab];
 $('#h2').textContent=tab==='est'?now.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
 $('#nav').innerHTML=[['est','Estudiar'],['org','Organizar'],['aju','Ajustes']].map(([k,t])=>`<button class="${k===tab?'on':''}" data-t="${k}">${t}</button>`).join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
 if(tab==='est'){
  m.innerHTML=`<div class="days" style="margin:0 0 12px">${[['hoy','Hoy'],['lis','Listas']].map(([k,t])=>`<button data-e="${k}" class="${k===se?'on':''}">${t}</button>`).join('')}</div><div id="sb"></div>`;
  m.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{se=b.dataset.e;draw()});
  se==='hoy'?vHoy($('#sb'),hoy):vListas($('#sb'));
 }else if(tab==='org'){
  m.innerHTML=`<div class="days" style="margin:0 0 12px">${[['obras','Obras'],['sem','Semana']].map(([k,t])=>`<button data-s="${k}" class="${k===sub?'on':''}">${t}</button>`).join('')}</div><div id="sb"></div>`;
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sub=b.dataset.s;draw()});
  sub==='obras'?vObras($('#sb')):vSem($('#sb'),hoy);
 }else{
  m.innerHTML=`<p style="color:var(--mu)">Los datos viven solo en este dispositivo. Hacé un respaldo seguido por si el sistema borra la caché.</p><label style="display:flex;gap:10px;align-items:center;color:var(--tx);font-size:16px;margin:0 0 12px"><input type="checkbox" id="rs" ${ls.get('resume')!=='0'?'checked':''} style="width:22px;height:22px"> Abrir cada obra en la última página que viste</label><div class="row"><button class="btn" id="ex">Exportar respaldo</button><button class="btn s" id="im">Importar respaldo</button></div><input type="file" id="imf" accept=".json,application/json" class="hide"><p id="msg" style="color:var(--br)"></p>`;
  $('#rs').onchange=e=>ls.set('resume',e.target.checked?'1':'0');$('#ex').onclick=exportar;$('#im').onclick=()=>$('#imf').click();$('#imf').onchange=e=>importar(e.target.files[0]);
 }
}
function vObras(m){
 const gr=[...new Set(obras.map(o=>o.grupo).filter(Boolean))].sort(),sin=obras.filter(o=>o.sin).length;
 const ch=[['','Todas'],...(sin?[['__sin','Sin clasificar ('+sin+')']]:[]),...gr.map(g=>[g,g])];
 if(!ch.some(c=>c[0]===gf))gf='';
 const l=obras.filter(o=>gf===''||(gf==='__sin'?o.sin:o.grupo===gf));
 m.innerHTML=`<div class="row" style="margin-top:0"><button class="btn" id="imp">+ Importar PDFs</button><button class="btn s" id="add">Nueva obra</button></div><input type="file" id="impf" accept="application/pdf" multiple class="hide"><div class="row" style="margin-top:0">${ch.map(([k,t])=>`<button class="btn s" data-g="${esc(k)}" style="padding:8px 12px;font-size:14px;${k===gf?'border-color:var(--br);color:var(--br)':''}">${esc(t)}</button>`).join('')}</div><input type="text" id="oq" placeholder="Buscar por título o compositor" value="${esc(oq)}"><p id="imsg" style="color:var(--br);margin:8px 0"></p><div id="lst"></div>`;
 const pl=()=>{const k=nz(oq),r=l.filter(o=>!k||nz(o.titulo+' '+o.compositor+' '+(o.grupo||'')).includes(k));$('#lst').innerHTML=r.length?sortO([...r]).map(o=>card(o,true)).join(''):'<div class="empty">No hay obras en esta vista.</div>';bindCards($('#lst'))};
 pl();$('#oq').oninput=e=>{oq=e.target.value;pl()};
 m.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gf=b.dataset.g;draw()});
 $('#add').onclick=()=>form();
 $('#imp').onclick=()=>$('#impf').click();
 $('#impf').onchange=async e=>{
  const fs=[...e.target.files],bad=[];let ok=0;
  for(const f of fs){
   $('#imsg').textContent=`Importando ${ok+bad.length+1} de ${fs.length}…`;
   try{
    const d=await pdfjsLib.getDocument({data:await f.arrayBuffer(),isEvalSupported:false}).promise;
    if(d.numPages>MAXP){bad.push(`${f.name} (${d.numPages} págs.)`);continue}
    const id=await rq('obras','readwrite',s=>s.add({titulo:f.name.replace(/\.pdf$/i,''),compositor:'',notas:'',prioridad:'media',dias:[],grupo:'',sin:true}));
    await rq('pdfs','readwrite',s=>s.put(f,id));ok++;
   }catch(x){bad.push(f.name+' (no se pudo leer)')}
  }
  await load();if(ok)gf='__sin';draw();
  $('#imsg').textContent=`${ok} importada(s).`+(bad.length?` No se importaron: ${bad.join(', ')}. El máximo es ${MAXP} páginas por PDF.`:'');
 };
}
function vSem(m,hoy){
 m.innerHTML=obras.length?sortO([...obras]).map(o=>`<div class="card" style="display:block"><div style="display:flex;gap:12px"><span class="dot ${o.prioridad}"></span><div><div class="tt">${esc(o.titulo)}</div><small>${esc(o.compositor)} · Prioridad ${PL[o.prioridad]}</small></div></div><div class="days">${ORD.map(d=>`<button data-o="${o.id}" data-d="${d}" class="${(o.dias||[]).includes(d)?'on':''} ${d===hoy?'hoy':''}">${DIAS[d]}</button>`).join('')}</div></div>`).join(''):'<div class="empty">Cargá obras en la pestaña Obras para organizarlas.</div>';
 m.querySelectorAll('.days button').forEach(b=>b.onclick=async()=>{
  const o=obras.find(x=>x.id==b.dataset.o),d=+b.dataset.d;o.dias=o.dias||[];
  o.dias=o.dias.includes(d)?o.dias.filter(x=>x!==d):[...o.dias,d];
  await rq('obras','readwrite',s=>s.put(o));b.classList.toggle('on')});
}
function card(o,ed){
 return `<div class="card" data-id="${o.id}"><span class="dot ${o.prioridad}"></span><div style="flex:1"><div class="tt">${esc(o.titulo)}</div><small>${esc(o.compositor)}${o.compositor?' · ':''}${PL[o.prioridad]}${o.grupo?' · '+esc(o.grupo):''}${o.sin?' · sin clasificar':''}${pdfIds.has(o.id)?'':' · sin PDF'}</small>${o.notas?`<small style="margin-top:4px;color:var(--tx)">${esc(o.notas)}</small>`:''}</div>${ed?'<button class="btn s ed" style="padding:8px 12px;font-size:14px">Editar</button>':''}</div>`;
}
function bindCards(m){
 m.querySelectorAll('.card[data-id]').forEach(c=>{
  const o=obras.find(x=>x.id==c.dataset.id),b=c.querySelector('.ed');
  if(b)b.onclick=e=>{e.stopPropagation();form(o)};
  c.onclick=()=>{if(pdfIds.has(o.id))abrir(o);else form(o)};
 });
}
function form(o){
 const e=!!o;o=o||{prioridad:'media',dias:[]};
 const M=$('#modal');M.classList.remove('hide');
 M.innerHTML=`<h2 style="margin:0">${e?'Editar obra':'Nueva obra'}</h2>
 <label>Título</label><input type="text" id="f1" value="${esc(o.titulo)}">
 <label>Compositor</label><input type="text" id="f2" value="${esc(o.compositor)}">
 <label>Notas de estudio</label><textarea id="f3" rows="3">${esc(o.notas)}</textarea>
 <label>Grupo o conjunto (opcional)</label><input type="text" id="f6" list="gl" value="${esc(o.grupo)}"><datalist id="gl">${[...new Set(obras.map(x=>x.grupo).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
 <label>Prioridad</label><select id="f4">${['alta','media','baja'].map(p=>`<option value="${p}" ${o.prioridad===p?'selected':''}>${PL[p]}</option>`).join('')}</select>
 <label>Partitura en PDF (máximo ${MAXP} páginas)${e&&pdfIds.has(o.id)?' · ya hay una cargada, elegí otra para reemplazarla':''}</label><input type="file" id="f5" accept="application/pdf">
 <label>Días de estudio</label><div class="days" id="fd">${ORD.map(d=>`<button type="button" data-d="${d}" class="${(o.dias||[]).includes(d)?'on':''}">${DIAS[d]}</button>`).join('')}</div>
 <p id="fe" style="color:var(--al)"></p>
 <div class="row"><button class="btn" id="fs">Guardar</button><button class="btn s" id="fc">Cancelar</button>${e?'<button class="btn d" id="fx">Eliminar</button>':''}</div>`;
 M.querySelectorAll('#fd button').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
 $('#fc').onclick=()=>M.classList.add('hide');
 if(e)$('#fx').onclick=async()=>{if(!confirm('¿Eliminar esta obra y su PDF?'))return;await rq('obras','readwrite',s=>s.delete(o.id));await rq('pdfs','readwrite',s=>s.delete(o.id));await rq('notas','readwrite',s=>s.delete(o.id));for(const l of listas.filter(l=>l.obras.includes(o.id)))await rq('listas','readwrite',s=>s.put({...l,obras:l.obras.filter(x=>x!==o.id)}));M.classList.add('hide');await load();draw()};
 $('#fs').onclick=async()=>{
  const err=t=>$('#fe').textContent=t,f=$('#f5').files[0],t=$('#f1').value.trim();
  if(!t)return err('Escribí el título de la obra.');
  if(!e&&!f)return err('Elegí el PDF de la partitura.');
  if(f){try{const d=await pdfjsLib.getDocument({data:await f.arrayBuffer(),isEvalSupported:false}).promise;if(d.numPages>MAXP)return err(`El PDF tiene ${d.numPages} páginas; el máximo es ${MAXP}.`)}catch(x){return err('No se pudo leer ese PDF. Revisá que sea un archivo válido y que pdf.min.js esté en la carpeta.')}}
  const n={...o,titulo:t,compositor:$('#f2').value.trim(),notas:$('#f3').value.trim(),prioridad:$('#f4').value,grupo:$('#f6').value.trim(),sin:false,dias:[...M.querySelectorAll('#fd .on')].map(b=>+b.dataset.d)};
  const id=await rq('obras','readwrite',s=>s.put(n));
  if(f)await rq('pdfs','readwrite',s=>s.put(f,id));
  M.classList.add('hide');await load();draw();
 };
}
function vHoy(m,hoy){
 const l=sortO(obras.filter(o=>(o.dias||[]).includes(hoy)));
 m.innerHTML=l.length?l.map(o=>card(o)).join(''):'<div class="empty">No hay obras asignadas para hoy.<br>Asignalas en Organizar, pestaña Semana.</div>';
 bindCards(m);
}
function vListas(m){
 const h=ymd(new Date()),k=l=>l.fecha&&l.fecha>=h?0:l.fecha?2:1;
 const ord=[...listas].sort((a,b)=>k(a)-k(b)||(k(a)===0?a.fecha.localeCompare(b.fecha):0)||a.nombre.localeCompare(b.nombre));
 m.innerHTML=`<div class="row" style="margin-top:0"><button class="btn" id="nl">+ Nueva lista</button></div>`+(ord.length?ord.map(l=>`<div class="card" data-l="${l.id}"><div style="flex:1"><div class="tt">${esc(l.nombre)}</div><small>${l.fecha?(l.fecha===h?'HOY · ':'')+fmtF(l.fecha)+' · ':''}${l.obras.length} obra${l.obras.length===1?'':'s'}</small></div></div>`).join(''):'<div class="empty">Todavía no hay listas.<br>Creá una por show, ensamble o clase y sumale las obras en el orden en que las vas a tocar.</div>');
 $('#nl').onclick=()=>formLista();
 m.querySelectorAll('[data-l]').forEach(c=>c.onclick=()=>detLista(+c.dataset.l));
}
function formLista(l){
 const e=!!l;l=l||{nombre:'',fecha:'',obras:[]};const M=$('#modal');M.classList.remove('hide');
 M.innerHTML=`<h2 style="margin:0">${e?'Editar lista':'Nueva lista'}</h2><label>Nombre (por ejemplo: Show del sábado, Ensamble tango)</label><input type="text" id="l1" value="${esc(l.nombre)}"><label>Fecha del show (opcional)</label><input type="date" id="l2" value="${esc(l.fecha)}"><p id="le" style="color:var(--al)"></p><div class="row"><button class="btn" id="ls">Guardar</button><button class="btn s" id="lc">Cancelar</button>${e?'<button class="btn d" id="lx">Eliminar lista</button>':''}</div>`;
 $('#lc').onclick=()=>e?detLista(l.id):M.classList.add('hide');
 if(e)$('#lx').onclick=async()=>{if(!confirm('¿Eliminar esta lista? Las obras no se borran.'))return;await rq('listas','readwrite',s=>s.delete(l.id));M.classList.add('hide');await load();draw()};
 $('#ls').onclick=async()=>{const n=$('#l1').value.trim();if(!n)return $('#le').textContent='Escribí un nombre para la lista.';const id=await rq('listas','readwrite',s=>s.put({...l,nombre:n,fecha:$('#l2').value}));await load();draw();detLista(id)};
}
function detLista(id){
 const l=listas.find(x=>x.id===id),M=$('#modal');
 if(!l){M.classList.add('hide');return}
 M.classList.remove('hide');
 const arr=l.obras.map(i=>obras.find(o=>o.id===i)).filter(Boolean),ids=arr.map(o=>o.id);
