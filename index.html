<style>
:root{--bg:#12161a;--pn:#1b2228;--ln:#2c353d;--tx:#e8e4da;--mu:#98a0a6;--br:#d4a84b;--al:#e0674f;--me:#d4a84b;--ba:#6fa3aa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
h1,h2,.tt{font-family:Georgia,'Times New Roman',serif;font-weight:600}
header{padding:18px 18px 6px}
header h1{margin:0;font-size:26px;text-transform:capitalize}
header p{margin:2px 0 0;color:var(--mu);font-size:14px}
main{flex:1;overflow:auto;padding:10px 14px 24px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--pn);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mu);font-size:14px}
nav button.on{color:var(--br);box-shadow:inset 0 2px 0 var(--br)}
.card{display:flex;gap:12px;align-items:flex-start;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:13px;margin:0 0 10px}
.card .tt{font-size:18px}.card small{color:var(--mu);display:block}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.alta{background:var(--al)}.media{background:var(--me)}.baja{background:var(--ba)}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
.btn{background:var(--br);color:#1a1405;border:0;border-radius:8px;padding:12px 16px;font-size:16px;font-weight:600}
.btn.s{background:var(--pn);color:var(--tx);border:1px solid var(--ln)}
.btn.d{background:none;color:var(--al);border:1px solid var(--al)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.days{display:flex;gap:4px;margin-top:8px}
.days button{flex:1;padding:9px 0;border-radius:6px;border:1px solid var(--ln);background:none;color:var(--mu);font-size:13px}
.days button.on{background:var(--br);color:#1a1405;border-color:var(--br);font-weight:700}
.days button.hoy{border-color:var(--tx)}
.modal{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 30px;z-index:5}
label{display:block;margin:14px 0 4px;color:var(--mu);font-size:14px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit}
#v{position:fixed;inset:0;background:#fff;z-index:9;display:flex;flex-direction:column}
#vb{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:var(--pn);border-bottom:1px solid var(--ln)}
#vb .tt{flex:1 1 120px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:16px}
.ib{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:50px;min-height:50px;padding:4px 8px;border:0;border-radius:12px;background:none;color:var(--mu);font-size:11px;line-height:1.1;white-space:nowrap;flex:none}
.ib i{display:block;height:22px}.ib svg{display:block}.ib.on{background:color-mix(in srgb,var(--br) 18%,transparent);color:var(--br)}
#ab{flex:1 1 auto;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;justify-content:flex-end}#ab::-webkit-scrollbar{display:none}
#ab .sep{width:1px;height:28px;background:var(--ln);margin:0 6px;flex:none}
#ab .sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;flex:none;margin:0 3px}#ab .sw.on{border-color:var(--tx)}#sws{display:flex;align-items:center;flex:none}
.ab2{border:0;background:none;color:var(--mu);font-size:12px;padding:10px 8px;border-radius:10px;flex:none;white-space:nowrap}.ab2.on{color:var(--br)}
@media(max-width:1000px){#vb.tools .tt{display:none}}
#pg{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 76px);z-index:3;background:rgba(20,20,20,.74);color:#fff;font-size:14px;padding:5px 12px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s}#pg.on{opacity:1;pointer-events:auto}#vb.hide~#pg{top:calc(env(safe-area-inset-top) + 12px)}
#vf{position:relative;background:var(--pn);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
#vs{display:flex;align-items:center;gap:4px;padding:4px 8px 0}#vs input{flex:1;min-width:0;accent-color:var(--br);margin:6px 0}#vs button{border:0;background:none;color:var(--tx);font-size:28px;line-height:1;padding:2px 14px;border-radius:10px}
#mn{display:flex;padding:2px 6px 6px}#mn .ib{flex:1;min-width:0}
#mb{position:absolute;left:0;right:0;bottom:100%;z-index:4;background:var(--pn);border-top:1px solid var(--ln);box-shadow:0 -10px 28px rgba(0,0,0,.35);padding:10px 12px 4px}.mr{display:flex;align-items:center;gap:8px;margin:0 0 8px}.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}.chips::-webkit-scrollbar{display:none}.chips button{flex:none;white-space:nowrap}.ml{color:var(--mu);font-size:13px}
#mb button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-size:15px}#mb button.on{border-color:var(--br);color:var(--br);background:color-mix(in srgb,var(--br) 14%,var(--bg))}#mb button.off{opacity:.3}#mdots{flex:1;min-width:0;flex-wrap:wrap;row-gap:4px}input.nm[type=number]{width:58px;flex:none;padding:8px;text-align:center}#mx .mr.w{gap:6px}#mgo{flex:none}#mmore{flex:none}#mgo{padding:10px 18px!important;font-weight:600}
#pages{scrollbar-width:none;flex:1;overflow:auto;display:flex;gap:4px;touch-action:pan-x pan-y}
.pw{position:relative;margin:auto 0;flex:none}.pw:first-child{margin-left:auto}.pw:last-child{margin-right:auto}.pw canvas{display:block}
.ov{position:absolute;left:0;top:0;pointer-events:none}
#pages.an .ov{pointer-events:auto;touch-action:none}#pages.an.mano .ov{pointer-events:none}#pages.an.sd .ov{touch-action:pan-x pan-y}
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--br);background:rgba(212,168,75,.35);padding:0}
#nt{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--pn);border-top:1px solid var(--ln);padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
#pages.inv .pg{filter:invert(.92) hue-rotate(180deg)}
#mlab{white-space:nowrap}#mbpm,.nm{width:60px;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;text-align:center}#msl{flex:1;min-width:50px;accent-color:var(--br)}
#mdots{display:flex;gap:6px;margin:0 4px}#mdots .dot{width:12px;height:12px;border-radius:50%;background:var(--ln)}#mdots .dot.on{background:var(--br)}#mdots .dot.ac.on{background:var(--al)}
.ag{padding:4px 0}
.li{display:flex;gap:6px}.li button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 11px;font-size:15px}
#rbar{margin:0 14px 8px;padding:10px 12px;border:1px solid var(--al);border-radius:10px;background:color-mix(in srgb,var(--al) 14%,var(--pn));display:flex;gap:8px;align-items:center;font-size:14px}
#lkc{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:6;width:50px;height:50px;border-radius:50%;border:0;background:rgba(20,20,20,.55);color:#fff;display:flex;align-items:center;justify-content:center}
#vch{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 10px 0}#vch::-webkit-scrollbar{display:none}#vch button{flex:none;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:999px;padding:6px 14px;font-size:13px}
.li button.on{background:var(--br);color:#1a1405;border-color:var(--br)}.mr.w{flex-wrap:wrap}#selb{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--pn);border:1px solid var(--br);border-radius:12px;padding:10px;margin-top:10px;box-shadow:0 -6px 20px rgba(0,0,0,.35)}#selb .btn{padding:10px 12px;font-size:14px}#selb button:disabled{opacity:.4}.card.chk{border-color:var(--br)}.cb{font-size:24px;color:var(--br)}
.hide{display:none!important}#pages::-webkit-scrollbar{display:none}

/* Aspecto: Folklore (poncho), Tango (bordó y oro) y Clásico */
html[data-t="folk"]{--bg:#1d1611;--pn:#2c2119;--ln:#4d3a2c;--tx:#f7ecda;--mu:#bfa98f;--br:#f2a931;--al:#e4572e;--me:#f2a931;--ba:#2ec4b6}
html[data-t="tango"]{--bg:#150a0d;--pn:#25121a;--ln:#4b2330;--tx:#f5e9d9;--mu:#bb9fa0;--br:#e2b44f;--al:#e24a43;--me:#e2b44f;--ba:#8fbcb4}
#band{height:10px;flex:none}html[data-t="clas"] #band{display:none}
html[data-t="folk"] #band{background:repeating-linear-gradient(90deg,#e4572e 0 18px,#1d1611 18px 23px,#f2a931 23px 39px,#1d1611 39px 44px,#2ec4b6 44px 60px,#1d1611 60px 65px,#f7ecda 65px 69px,#1d1611 69px 74px)}
html[data-t="tango"] #band{background:repeating-linear-gradient(90deg,#6e1520 0 5px,#c2383f 5px 6px,#2a0c11 6px 10px);border-bottom:2px solid var(--br)}
header{position:relative}
:is(html[data-t="folk"],html[data-t="tango"]) header h1{color:var(--br)}
:is(html[data-t="folk"],html[data-t="tango"]) header::before{content:'♫';position:absolute;right:16px;top:0;font-size:60px;color:var(--br);opacity:.2;pointer-events:none}
:is(html[data-t="folk"],html[data-t="tango"]) header::after{content:'';display:block;height:17px;margin-top:8px;background:repeating-linear-gradient(to bottom,var(--ln) 0 1px,transparent 1px 4px)}
:is(html[data-t="folk"],html[data-t="tango"]) .card{border-left:4px solid var(--ln)}
:is(html[data-t="folk"],html[data-t="tango"]) .card:has(.dot.alta){border-left-color:var(--al)}
:is(html[data-t="folk"],html[data-t="tango"]) .card:has(.dot.media){border-left-color:var(--me)}
:is(html[data-t="folk"],html[data-t="tango"]) .card:has(.dot.baja){border-left-color:var(--ba)}
:is(html[data-t="folk"],html[data-t="tango"]) nav{border-top:2px solid var(--br)}
:is(html[data-t="folk"],html[data-t="tango"]) h2{color:var(--br)}
:is(html[data-t="folk"],html[data-t="tango"]) .empty::before{content:'♪ ♫ ♪';display:block;font-size:30px;color:var(--br);opacity:.6;margin-bottom:6px;letter-spacing:6px}
#mdots .dot.md.on{background:var(--me)}
#sc{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--pn);border-top:1px solid var(--ln);padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-height:65%;overflow:auto}
.scr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}

#prg{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 12px);z-index:100;min-width:260px;max-width:92vw;background:var(--pn);border:1px solid var(--br);border-radius:14px;padding:12px 16px;box-shadow:0 8px 30px rgba(0,0,0,.5)}#prg b{display:block;font-size:15px;margin-bottom:6px}#prg small{color:var(--mu)}#prg.ok{border-color:#2e9e5b}#prg.bad{border-color:var(--al)}
.pb{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;margin:4px 0}.pb i{display:block;height:100%;background:var(--br);transition:width .2s}.pb.ind i{width:35%;animation:ind 1.1s infinite ease-in-out}@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
#lps{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--pn);border-top:1px solid var(--ln)}#lps b{font-size:13px;min-width:112px;color:var(--tx);white-space:nowrap}#lps .sg{display:flex;gap:2px;flex:1;height:12px}#lps .sg i{flex:1;border-radius:3px;background:var(--ln)}#lps .sg i.p{background:color-mix(in srgb,var(--br) 55%,var(--ln))}#lps .sg i.c{background:var(--br);transform:scaleY(1.5);box-shadow:0 0 8px var(--br)}#lps .sg i.e{outline:1px solid var(--al);outline-offset:-1px}#lps .sg i.c.e{background:var(--al);box-shadow:0 0 8px var(--al)}#lps .sg i.c.s{background:#2e9e5b;box-shadow:0 0 8px #2e9e5b}#lps b.s{color:#5fd08c}#lps b.e{color:var(--al)}
#v.lk #pg{pointer-events:none!important}#v.lk #sc,#v.lk #nt,#v.lk #mb,#v.lk #vch{display:none!important}
@media(min-width:900px){.cg,#lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));column-gap:12px;align-items:start}.cg>.row,.cg>.empty{grid-column:1/-1}main{padding:10px 22px 24px}}
:root{--mp:14px}main{padding:10px var(--mp) 24px}@media(min-width:900px){:root{--mp:22px}}
.tb{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);margin:0 calc(-1*var(--mp)) 8px;padding:8px var(--mp);border-bottom:1px solid var(--ln)}.tb .sp{flex:1}.tb b{font-size:16px}.tb .btn{padding:10px 14px;font-size:15px}.tb.sel{background:color-mix(in srgb,var(--br) 14%,var(--bg));border-bottom-color:var(--br)}.tb button:disabled{opacity:.4}
.srow{display:flex;gap:8px;margin:0 0 8px}.srow input{flex:1;min-width:0}.srow select{width:auto;flex:none}
.fch{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}.fch::-webkit-scrollbar{display:none}.fch button{flex:none;background:var(--pn);border:1px solid var(--ln);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}.fch button i{font-style:normal;color:var(--mu);margin-left:4px}.fch button.on{border-color:var(--br);color:var(--br)}
.hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--br) 10%,var(--pn));border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:2px 0 10px;color:var(--tx);font-size:14px}.hint span{flex:1 1 200px}.hint .btn{padding:8px 12px;font-size:14px}
.ib2{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:none;color:var(--mu);font-size:18px}
.cb{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--mu);display:flex;align-items:center;justify-content:center;font-weight:700;color:#1a1405;margin-top:2px}.cb.on{background:var(--br);border-color:var(--br)}
.card .tt{overflow-wrap:anywhere}
#mb{left:50%;right:auto;transform:translateX(-50%);width:min(680px,calc(100% - 16px));bottom:calc(100% + 8px);border:1px solid var(--ln);border-radius:16px;padding:10px 12px 4px}
#mb select{width:auto;max-width:42%;padding:7px 8px;font-size:15px;border-radius:10px;background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
#mb .mr:first-child #mgo{margin-left:2px}#mgo{font-weight:700}
</style></head><body>

<script>
/* ===== MAPA DEL CÓDIGO (buscá estos nombres con Ctrl+F) =====
 DATOS      init, load (obras=activas, papelera=borradas, todas=ambas), rq (IndexedDB), ls (localStorage), pdfOf
 PANTALLAS  draw -> vHoy, vAgenda, vPractica, vListas, vObras, vSem, Ajustes (dentro de draw)
 OBRAS      card, bindCards, form (alta/edición), divForm (dividir PDF), impPdfs (importar PDFs), dupDe/hashB (repetidas)
 BORRADO    borrarObra (a la papelera), borrarDef (definitivo), verPapelera, vObras (barra superior de selección)/moverSel
 LISTAS     detLista, formLista, selObras
 LECTOR     abrir, vista, pintar, ir (páginas y bucle), calcCrop, cerrarV, lockSet (escenario), chipsSec, scAbrir
 METRÓNOMO  M, mui, msch, mgo, mstop, clic, lpUI (repetir páginas)
 PRÁCTICA   PR, ptick, pguardar, prui

function prog(t,c,n){let d=$('#prg');if(!d){d=document.createElement('div');d.id='prg';document.body.appendChild(d)}d.className='';d.onclick=null;clearTimeout(progFin.t);d.innerHTML=`<b>${t}</b>`+(n?`<div class="pb"><i style="width:${Math.round(c/n*100)}%"></i></div><small>${c} de ${n}</small>`:'<div class="pb ind"><i></i></div>')}

async function dupDe(f,excl){
 const h=await hashB(f);
 for(const o of todas){if(o.id===excl||o.ref)continue;
  if(!o.h&&h){const b=await rq('pdfs','readonly',s=>s.get(o.id));if(b&&b.size===f.size){const x=await hashB(b);if(x){o.h=x;await rq('obras','readwrite',s=>s.put(o))}}}
  if(h&&o.h===h)return{o,h,igual:true};
 }
 const t=nz(f.name.replace(/\.pdf$/i,'')),o=todas.find(x=>x.id!==excl&&nz(x.titulo)===t);
 return o?{o,h,igual:false}:{o:null,h}}
const dupTxt=(n,d)=>`“${n}” ${d.igual?'es el mismo archivo que':'tiene el mismo nombre que'} “${d.o.titulo}”${d.o.del?' (está en la papelera)':''}. ¿Importarla igual?`;
async function impPdfs(fs,msg){
 const bad=[],ids=[],dup=[];prog('Importando partituras…',0,fs.length);
 for(const f of fs){
  msg(`Importando ${ids.length+bad.length+dup.length+1} de ${fs.length}…`);prog('Importando partituras · '+f.name,ids.length+bad.length+dup.length,fs.length);
  try{
   const d=await pdfjsLib.getDocument({data:await f.arrayBuffer(),isEvalSupported:false}).promise;
   if(d.numPages>MAXP){bad.push(`${f.name} (${d.numPages} págs.)`);continue}
   const du=await dupDe(f);if(du.o&&!confirm(dupTxt(f.name,du))){dup.push(f.name);continue}
   const id=await rq('obras','readwrite',s=>s.add({titulo:f.name.replace(/\.pdf$/i,''),compositor:'',notas:'',prioridad:'media',dias:[],grupo:'',sin:true,h:du.h||undefined}));
   await rq('pdfs','readwrite',s=>s.put(f,id));ids.push(id);await load();
  }catch(x){bad.push(f.name+' (no se pudo leer)')}
 }
 await load();
 progFin(ids.length+' importada'+(ids.length===1?'':'s')+(dup.length?' · '+dup.length+' repetida'+(dup.length===1?'':'s')+' omitida'+(dup.length===1?'':'s'):'')+(bad.length?' · '+bad.length+' con problema (más de '+MAXP+' págs. o ilegible)':''),!bad.length);
 return{ids,bad,dup};
}

const say=t=>{const e=$('#msg');if(e)e.textContent=t;toast(t)};
function rstate(){const t=+ls.get('ultresp')||0,d=t?Math.floor((Date.now()-t)/864e5):null;return{t,d,mal:d===null||d>=3}}
function rstUI(){
 const s=rstate(),b=$('#rbar'),sn=+ls.get('rsnooze')||0,show=tab!=='aju'&&s.mal&&Date.now()>sn&&obras.length>0;
 b.classList.toggle('hide',!show);
 if(show){b.innerHTML=`<span style="flex:1">${s.d===null?'Todavía no hiciste un respaldo. Si Android borra los datos, se pierden tus partituras y marcas.':'Hace '+s.d+' días que no hacés un respaldo.'}</span><button class="btn" id="rbg" style="padding:8px 12px;font-size:14px">Respaldar</button><button class="btn s" id="rbl" style="padding:8px 10px;font-size:14px">Luego</button>`;$('#rbg').onclick=()=>exportar('share');$('#rbl').onclick=()=>{ls.set('rsnooze',String(Date.now()+864e5));rstUI()}}
 const rt=$('#rst');if(rt){rt.textContent=s.d===null?'Todavía no hiciste ningún respaldo.':'Último respaldo: '+(s.d===0?'hoy':s.d===1?'ayer':'hace '+s.d+' días')+'.';rt.style.color=s.mal?'var(--al)':'var(--br)'}
 const nb=document.querySelector('#nav button[data-t=aju]');if(nb)nb.textContent='♭ Ajustes'+(s.mal&&obras.length?' ●':'');
}
function aviso(t){
 let d=$('#err');if(!d){d=document.createElement('div');d.id='err';d.style.cssText='position:fixed;left:8px;right:8px;bottom:70px;z-index:99;background:#5a1d17;color:#fff;border:1px solid var(--al);border-radius:10px;padding:12px;font-size:14px';d.onclick=()=>d.remove();document.body.appendChild(d)}
 d.textContent='Algo falló: '+t+'. (Tocá para cerrar.) Si se repite, hacé un respaldo y mandame una captura de este mensaje.';
}
addEventListener('error',e=>aviso(e.message||'error'));
addEventListener('unhandledrejection',e=>aviso(String(e.reason&&e.reason.message||e.reason||'error desconocido')));
init().catch(e=>aviso('no se pudo abrir el almacenamiento ('+(e&&e.message||e)+')'));
</script></body></html>
