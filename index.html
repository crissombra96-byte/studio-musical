<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12161a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Estudio Musical</title>
<style>
:root{--bg:#12161a;--pn:#1b2228;--ln:#2c353d;--tx:#e8e4da;--mu:#98a0a6;--br:#d4a84b;--al:#e0674f;--me:#d4a84b;--ba:#6fa3aa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
h1,h2,.tt{font-family:Georgia,'Times New Roman',serif;font-weight:600}
header{padding:18px 18px 6px}
header h1{margin:0;font-size:26px;text-transform:capitalize}
header p{margin:2px 0 0;color:var(--mu);font-size:14px}
main{flex:1;overflow:auto;padding:10px 14px 24px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--pn);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mu);font-size:14px}
nav button.on{color:var(--br);box-shadow:inset 0 2px 0 var(--br)}
.card{display:flex;gap:12px;align-items:flex-start;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:13px;margin:0 0 10px}
.card .tt{font-size:18px}.card small{color:var(--mu);display:block}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.alta{background:var(--al)}.media{background:var(--me)}.baja{background:var(--ba)}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
.btn{background:var(--br);color:#1a1405;border:0;border-radius:8px;padding:12px 16px;font-size:16px;font-weight:600}
.btn.s{background:var(--pn);color:var(--tx);border:1px solid var(--ln)}
.btn.d{background:none;color:var(--al);border:1px solid var(--al)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.days{display:flex;gap:4px;margin-top:8px}
.days button{flex:1;padding:9px 0;border-radius:6px;border:1px solid var(--ln);background:none;color:var(--mu);font-size:13px}
.days button.on{background:var(--br);color:#1a1405;border-color:var(--br);font-weight:700}
.days button.hoy{border-color:var(--tx)}
.modal{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 30px;z-index:5}
label{display:block;margin:14px 0 4px;color:var(--mu);font-size:14px}
input[type=text],textarea,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit}
#v{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column}
#vb{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--pn)}
#vb .tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#vb button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;font-size:15px}
#vb button.on{border-color:var(--br);color:var(--br)}
#pages{flex:1;overflow:auto;display:flex;gap:8px;touch-action:pan-x pan-y}
#pages canvas{margin:auto;flex:none}
#pages.inv canvas{filter:invert(.92) hue-rotate(180deg)}
#pg{color:var(--mu);font-size:14px;min-width:64px;text-align:center}
.hide{display:none!important}
</style></head><body>
<header><h1 id="h1"></h1><p id="h2"></p></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal" class="modal hide"></div>
<div id="v" class="hide">
 <div id="vb"><button id="vx">✕</button><span class="tt" id="vt"></span><button id="vi" title="Invertir colores">◐</button><button id="vz">×1</button><button id="vm"></button><button id="vp">‹</button><span id="pg"></span><button id="vn">›</button></div>
 <div id="pages"></div>
</div>
<script src="pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],ORD=[1,2,3,4,5,6,0],PRI={alta:0,media:1,baja:2};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,obras=[],pdfIds=new Set(),tab='hoy';
const rq=(s,m,f)=>new Promise((ok,no)=>{const r=f(db.transaction(s,m).objectStore(s));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

async function init(){
 db=await new Promise((ok,no)=>{const r=indexedDB.open('estudio',1);r.onupgradeneeded=()=>{r.result.createObjectStore('obras',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('pdfs')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
 await load();draw();
}
async function load(){
 obras=await rq('obras','readonly',s=>s.getAll());
 pdfIds=new Set(await rq('pdfs','readonly',s=>s.getAllKeys()));
}
const sortO=a=>a.sort((x,y)=>PRI[x.prioridad]-PRI[y.prioridad]||x.titulo.localeCompare(y.titulo));
const PL={alta:'Alta',media:'Media',baja:'Baja'};

function draw(){
 const now=new Date(),hoy=now.getDay();
 $('#h1').textContent={hoy:'Hoy',rep:'Repertorio',sem:'Semana',aju:'Ajustes'}[tab];
 $('#h2').textContent=tab==='hoy'?now.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
 $('#nav').innerHTML=[['hoy','Hoy'],['rep','Repertorio'],['sem','Semana'],['aju','Ajustes']].map(([k,t])=>`<button class="${k===tab?'on':''}" data-t="${k}">${t}</button>`).join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
 const m=$('#main');
 if(tab==='hoy'){
  const l=sortO(obras.filter(o=>(o.dias||[]).includes(hoy)));
  m.innerHTML=l.length?l.map(o=>card(o)).join(''):'<div class="empty">No hay obras asignadas para hoy.<br>Asignalas en la pestaña Semana.</div>';
  bindCards(m);
 }else if(tab==='rep'){
  m.innerHTML='<button class="btn" id="add">+ Agregar obra</button><div style="height:12px"></div>'+(obras.length?sortO([...obras]).map(o=>card(o,true)).join(''):'<div class="empty">Todavía no cargaste obras.</div>');
  $('#add').onclick=()=>form();bindCards(m,true);
 }else if(tab==='sem'){
  m.innerHTML=obras.length?sortO([...obras]).map(o=>`<div class="card" style="display:block"><div style="display:flex;gap:12px"><span class="dot ${o.prioridad}"></span><div><div class="tt">${esc(o.titulo)}</div><small>${esc(o.compositor)} · Prioridad ${PL[o.prioridad]}</small></div></div><div class="days">${ORD.map(d=>`<button data-o="${o.id}" data-d="${d}" class="${(o.dias||[]).includes(d)?'on':''} ${d===hoy?'hoy':''}">${DIAS[d]}</button>`).join('')}</div></div>`).join(''):'<div class="empty">Cargá obras en Repertorio para organizarlas.</div>';
  m.querySelectorAll('.days button').forEach(b=>b.onclick=async()=>{
   const o=obras.find(x=>x.id==b.dataset.o),d=+b.dataset.d;o.dias=o.dias||[];
   o.dias=o.dias.includes(d)?o.dias.filter(x=>x!==d):[...o.dias,d];
   await rq('obras','readwrite',s=>s.put(o));b.classList.toggle('on')});
 }else{
  m.innerHTML=`<p style="color:var(--mu)">Los datos viven solo en este dispositivo. Hacé un respaldo seguido por si el sistema borra la caché.</p><div class="row"><button class="btn" id="ex">Exportar respaldo</button><button class="btn s" id="im">Importar respaldo</button></div><input type="file" id="imf" accept=".json,application/json" class="hide"><p id="msg" style="color:var(--br)"></p>`;
  $('#ex').onclick=exportar;$('#im').onclick=()=>$('#imf').click();$('#imf').onchange=e=>importar(e.target.files[0]);
 }
}
function card(o,ed){
 return `<div class="card" data-id="${o.id}"><span class="dot ${o.prioridad}"></span><div style="flex:1"><div class="tt">${esc(o.titulo)}</div><small>${esc(o.compositor)} · ${PL[o.prioridad]}${pdfIds.has(o.id)?'':' · sin PDF'}</small>${o.notas?`<small style="margin-top:4px;color:var(--tx)">${esc(o.notas)}</small>`:''}</div>${ed?'<button class="btn s ed" style="padding:8px 12px;font-size:14px">Editar</button>':''}</div>`;
}
function bindCards(m){
 m.querySelectorAll('.card[data-id]').forEach(c=>{
  const o=obras.find(x=>x.id==c.dataset.id),b=c.querySelector('.ed');
  if(b)b.onclick=e=>{e.stopPropagation();form(o)};
  c.onclick=()=>{if(pdfIds.has(o.id))abrir(o);else form(o)};
 });
}
function form(o){
 const e=!!o;o=o||{prioridad:'media',dias:[]};
 const M=$('#modal');M.classList.remove('hide');
 M.innerHTML=`<h2 style="margin:0">${e?'Editar obra':'Nueva obra'}</h2>
 <label>Título</label><input type="text" id="f1" value="${esc(o.titulo)}">
 <label>Compositor</label><input type="text" id="f2" value="${esc(o.compositor)}">
 <label>Notas de estudio</label><textarea id="f3" rows="3">${esc(o.notas)}</textarea>
 <label>Prioridad</label><select id="f4">${['alta','media','baja'].map(p=>`<option value="${p}" ${o.prioridad===p?'selected':''}>${PL[p]}</option>`).join('')}</select>
 <label>Partitura en PDF (máximo 7 páginas)${e&&pdfIds.has(o.id)?' · ya hay una cargada, elegí otra para reemplazarla':''}</label><input type="file" id="f5" accept="application/pdf">
 <label>Días de estudio</label><div class="days" id="fd">${ORD.map(d=>`<button type="button" data-d="${d}" class="${(o.dias||[]).includes(d)?'on':''}">${DIAS[d]}</button>`).join('')}</div>
 <p id="fe" style="color:var(--al)"></p>
 <div class="row"><button class="btn" id="fs">Guardar</button><button class="btn s" id="fc">Cancelar</button>${e?'<button class="btn d" id="fx">Eliminar</button>':''}</div>`;
 M.querySelectorAll('#fd button').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
 $('#fc').onclick=()=>M.classList.add('hide');
 if(e)$('#fx').onclick=async()=>{if(!confirm('¿Eliminar esta obra y su PDF?'))return;await rq('obras','readwrite',s=>s.delete(o.id));await rq('pdfs','readwrite',s=>s.delete(o.id));M.classList.add('hide');await load();draw()};
 $('#fs').onclick=async()=>{
  const err=t=>$('#fe').textContent=t,f=$('#f5').files[0],t=$('#f1').value.trim();
  if(!t)return err('Escribí el título de la obra.');
  if(!e&&!f)return err('Elegí el PDF de la partitura.');
  if(f){try{const d=await pdfjsLib.getDocument({data:await f.arrayBuffer(),isEvalSupported:false}).promise;if(d.numPages>7)return err(`El PDF tiene ${d.numPages} páginas; el máximo es 7.`)}catch(x){return err('No se pudo leer ese PDF. Revisá que sea un archivo válido y que pdf.min.js esté en la carpeta.')}}
  const n={...o,titulo:t,compositor:$('#f2').value.trim(),notas:$('#f3').value.trim(),prioridad:$('#f4').value,dias:[...M.querySelectorAll('#fd .on')].map(b=>+b.dataset.d)};
  const id=await rq('obras','readwrite',s=>s.put(n));
  if(f)await rq('pdfs','readwrite',s=>s.put(f,id));
  M.classList.add('hide');await load();draw();
 };
}
/* Visor */
const ZS=[1,1.5,2,3],V={doc:null,n:0,zoom:1,mode:+ls.get('modo')||1,inv:ls.get('inv')==='1'};let tok=0,wl=null;
async function abrir(o){
 const b=await rq('pdfs','readonly',s=>s.get(o.id));
 try{V.doc=await pdfjsLib.getDocument({data:await b.arrayBuffer(),isEvalSupported:false}).promise}catch(e){alert('No se pudo abrir la partitura. Revisá que pdf.min.js y pdf.worker.min.js estén en la carpeta de la app.');return}
 V.n=0;V.zoom=1;
 $('#vt').textContent=o.titulo;$('#v').classList.remove('hide');vista();
 try{wl=await navigator.wakeLock.request('screen')}catch(e){}
}
function vista(){
 $('#vm').textContent=V.mode===1?'1 pág.':'2 pág.';$('#vm').classList.toggle('on',V.mode===2);
 $('#vz').textContent='×'+V.zoom;$('#vz').classList.toggle('on',V.zoom>1);$('#vi').classList.toggle('on',V.inv);$('#pages').classList.toggle('inv',V.inv);pintar();
}
async function pintar(){
 const st=++tok,box=$('#pages'),tot=V.doc.numPages;box.innerHTML='';
 const cnt=V.mode===2&&V.n+1<tot?2:1,W=box.clientWidth-8,H=box.clientHeight-8,dpr=Math.min(devicePixelRatio||1,2);
 for(let i=0;i<cnt;i++){
  const p=await V.doc.getPage(V.n+1+i);if(st!==tok)return;
  const v=p.getViewport({scale:1}),s=Math.min((W-8*(cnt-1))/cnt/v.width,H/v.height)*V.zoom,vp=p.getViewport({scale:s*dpr});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=vp.width/dpr+'px';c.style.height=vp.height/dpr+'px';box.appendChild(c);
  await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
 }
 $('#pg').textContent=cnt===2?`${V.n+1}-${V.n+2} / ${tot}`:`${V.n+1} / ${tot}`;
}
function ir(d){
 const st=V.mode,t=V.doc.numPages,n=V.n+d*st;
 if(n<0||n>=t)return;V.n=n;pintar();
}
$('#vp').onclick=()=>ir(-1);$('#vn').onclick=()=>ir(1);
$('#vm').onclick=()=>{V.mode=V.mode===1?2:1;if(V.mode===2)V.n-=V.n%2;ls.set('modo',V.mode);vista()};
$('#vz').onclick=()=>{V.zoom=ZS[(ZS.indexOf(V.zoom)+1)%ZS.length];vista()};
$('#vi').onclick=()=>{V.inv=!V.inv;ls.set('inv',V.inv?'1':'0');vista()};
$('#vx').onclick=()=>{tok++;$('#v').classList.add('hide');V.doc=null;if(wl){wl.release();wl=null}};
$('#pages').onclick=e=>{const r=$('#pages').getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(x<.3)ir(-1);else if(x>.7)ir(1)};
addEventListener('resize',()=>{if(V.doc)pintar()});
/* Respaldo */
const b2d=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
async function exportar(){
 const out={version:1,obras,pdfs:{}};
 for(const o of obras){const b=await rq('pdfs','readonly',s=>s.get(o.id));if(b)out.pdfs[o.id]=await b2d(b)}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
 a.download='respaldo-estudio-'+new Date().toISOString().slice(0,10)+'.json';a.click();$('#msg').textContent='Respaldo exportado.';
}
async function importar(f){
 if(!f||!confirm('Importar reemplaza todo lo que hay ahora en la app. ¿Seguir?'))return;
 try{
  const d=JSON.parse(await f.text());
  await rq('obras','readwrite',s=>s.clear());await rq('pdfs','readwrite',s=>s.clear());
  for(const o of d.obras){await rq('obras','readwrite',s=>s.put(o));const u=d.pdfs[o.id];if(u)await rq('pdfs','readwrite',s=>s.put(await0(u),o.id))}
 }catch(e){$('#msg').textContent='No se pudo importar: el archivo no es un respaldo válido.';return}
 await load();draw();$('#msg').textContent='Respaldo importado.';
}
const await0=u=>{const [h,b]=u.split(','),m=h.match(/:(.*?);/)[1],bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})};
init();
</script></body></html>
