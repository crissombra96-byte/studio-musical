<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12161a">
<script>try{document.documentElement.dataset.t=localStorage.getItem("tema")||"folk"}catch(e){document.documentElement.dataset.t="folk"}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Estudio Musical</title>
<style>
:root{--bg:#12161a;--pn:#1b2228;--ln:#2c353d;--tx:#e8e4da;--mu:#98a0a6;--br:#d4a84b;--al:#e0674f;--me:#d4a84b;--ba:#6fa3aa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
h1,h2,.tt{font-family:Georgia,'Times New Roman',serif;font-weight:600}
header{padding:18px 18px 6px}
header h1{margin:0;font-size:26px;text-transform:capitalize}
header p{margin:2px 0 0;color:var(--mu);font-size:14px}
main{flex:1;overflow:auto;padding:10px 14px 24px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--pn);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mu);font-size:14px}
nav button.on{color:var(--br);box-shadow:inset 0 2px 0 var(--br)}
.card{display:flex;gap:12px;align-items:flex-start;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:13px;margin:0 0 10px}
.card .tt{font-size:18px}.card small{color:var(--mu);display:block}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.alta{background:var(--al)}.media{background:var(--me)}.baja{background:var(--ba)}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
.btn{background:var(--br);color:#1a1405;border:0;border-radius:8px;padding:12px 16px;font-size:16px;font-weight:600}
.btn.s{background:var(--pn);color:var(--tx);border:1px solid var(--ln)}
.btn.d{background:none;color:var(--al);border:1px solid var(--al)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.days{display:flex;gap:4px;margin-top:8px}
.days button{flex:1;padding:9px 0;border-radius:6px;border:1px solid var(--ln);background:none;color:var(--mu);font-size:13px}
.days button.on{background:var(--br);color:#1a1405;border-color:var(--br);font-weight:700}
.days button.hoy{border-color:var(--tx)}
.modal{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 30px;z-index:5}
label{display:block;margin:14px 0 4px;color:var(--mu);font-size:14px}
input[type=text],input[type=date],textarea,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit}
#v{position:fixed;inset:0;background:#fff;z-index:9;display:flex;flex-direction:column}
#vb{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--pn)}
#vb .tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#vb button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;font-size:15px}
#vb button.on{border-color:var(--br);color:var(--br)}
#vb .tt{min-width:0}#vb button{white-space:nowrap;flex:none}
@media(max-width:520px){#vb{gap:4px;padding-left:5px;padding-right:5px}#vb button{padding:9px 8px;font-size:14px}#pg{min-width:0;padding:0 2px}}
#pages{scrollbar-width:none;flex:1;overflow:auto;display:flex;gap:4px;touch-action:pan-x pan-y}
.pw{position:relative;margin:auto 0;flex:none}.pw:first-child{margin-left:auto}.pw:last-child{margin-right:auto}.pw canvas{display:block}
.ov{position:absolute;left:0;top:0;pointer-events:none}
#pages.an .ov{pointer-events:auto;touch-action:none}#pages.an.mano .ov{pointer-events:none}#pages.an.sd .ov{touch-action:pan-x pan-y}
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--br);background:rgba(212,168,75,.35);padding:0}
#ab{display:flex;flex-wrap:nowrap;overflow-x:auto;align-items:center;gap:4px;padding:6px 8px;background:var(--pn);border-top:1px solid var(--ln)}
#ab button{flex:none;white-space:nowrap;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 9px;font-size:14px}#ab button.on{border-color:var(--br);color:var(--br)}
#ab .sw{width:28px;height:28px;border-radius:50%;padding:0}#ab .sw.on{border:3px solid var(--tx)}#sws{display:flex;gap:6px;flex:none}
#nt{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--pn);border-top:1px solid var(--ln);padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
#pages.inv .pg{filter:invert(.92) hue-rotate(180deg)}
#mb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;background:var(--pn);border-top:1px solid var(--ln)}#vb.hide~#mb{display:none}
#mb button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 11px;font-size:15px}#mb button.on{border-color:var(--br);color:var(--br)}
#mbpm{width:64px;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;text-align:center}#msl{flex:1;min-width:110px;accent-color:var(--br)}
#mdots{display:flex;gap:6px;margin:0 4px}#mdots .dot{width:12px;height:12px;border-radius:50%;background:var(--ln)}#mdots .dot.on{background:var(--br)}#mdots .dot.ac.on{background:var(--al)}
.ag{padding:4px 0}
#pg{color:var(--mu);font-size:14px;min-width:64px;text-align:center}
#vf{padding:2px 16px calc(2px + env(safe-area-inset-bottom));background:var(--pn);border-top:1px solid var(--ln)}#vf input{width:100%;accent-color:var(--br);margin:8px 0}.li{display:flex;gap:6px}.li button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 11px;font-size:15px}
.hide{display:none!important}#pages::-webkit-scrollbar{display:none}

/* Aspecto: Folklore (poncho), Tango (bordó y oro) y Clásico */
html[data-t="folk"]{--bg:#1d1611;--pn:#2c2119;--ln:#4d3a2c;--tx:#f7ecda;--mu:#bfa98f;--br:#f2a931;--al:#e4572e;--me:#f2a931;--ba:#2ec4b6}
html[data-t="tango"]{--bg:#150a0d;--pn:#25121a;--ln:#4b2330;--tx:#f5e9d9;--mu:#bb9fa0;--br:#e2b44f;--al:#e24a43;--me:#e2b44f;--ba:#8fbcb4}
#band{height:10px;flex:none}html[data-t="clas"] #band{display:none}
html[data-t="folk"] #band{background:repeating-linear-gradient(90deg,#e4572e 0 18px,#1d1611 18px 23px,#f2a931 23px 39px,#1d1611 39px 44px,#2ec4b6 44px 60px,#1d1611 60px 65px,#f7ecda 65px 69px,#1d1611 69px 74px)}
html[data-t="tango"] #band{background:repeating-linear-gradient(90deg,#6e1520 0 5px,#c2383f 5px 6px,#2a0c11 6px 10px);border-bottom:2px solid var(--br)}
header{position:relative}
:is(html[data-t="folk"],html[data-t="tango"]) header h1{color:var(--br)}
:is(html[data-t="folk"],html[data-t="tango"]) header::before{content:'♫';position:absolute;right:16px;top:0;font-size:60px;color:var(--br);opacity:.2;pointer-events:none}
:is(html[data-t="folk"],html[data-t="tango"]) header::after{content:'';display:block;height:17px;margin-top:8px;background:repeating-linear-gradient(to bottom,var(--ln) 0 1px,transparent 1px 4px)}
:is(html[data-t="folk"],html[data-t="tango"]) .card{border-left:4px solid var(--ln)}
:is(html[data-t="folk"],html[data-t="tango"]) .card:has(.dot.alta){border-left-color:var(--al)}
:is(html[data-t="folk"],html[data-t="tango"]) .card:has(.dot.media){border-left-color:var(--me)}
:is(html[data-t="folk"],html[data-t="tango"]) .card:has(.dot.baja){border-left-color:var(--ba)}
:is(html[data-t="folk"],html[data-t="tango"]) nav{border-top:2px solid var(--br)}
:is(html[data-t="folk"],html[data-t="tango"]) h2{color:var(--br)}
:is(html[data-t="folk"],html[data-t="tango"]) .empty::before{content:'♪ ♫ ♪';display:block;font-size:30px;color:var(--br);opacity:.6;margin-bottom:6px;letter-spacing:6px}
#sc{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--pn);border-top:1px solid var(--ln);padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-height:65%;overflow:auto}
.scr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
#pg{cursor:pointer;text-decoration:underline dotted;text-underline-offset:4px}
</style></head><body>
<div id="band"></div>
<header><h1 id="h1"></h1><p id="h2"></p></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal" class="modal hide"></div>
<div id="v" class="hide">
 <div id="vb"><button id="vx">✕</button><span class="tt" id="vt"></span><button id="vo" class="hide">✎ Anotar</button><button id="vmt" title="Metrónomo">♩</button><button id="vh" title="Media página">½</button><button id="vz">×1</button><button id="vm"></button><button id="vp">‹</button><span id="pg"></span><button id="vn">›</button></div>
 <div id="ab" class="hide"><button data-t="l">Lápiz</button><button data-t="h">Resaltador</button><button data-t="g">Goma</button><button data-t="n">Nota</button><button data-t="m">Mover</button><span id="sws"></span><button id="agr"></button><button id="aun">Deshacer</button><button id="adi"></button><button id="aoc"></button></div>
 <div id="mb" class="hide"><button id="mm">−</button><input id="mbpm" type="number" min="30" max="240" inputmode="numeric"><button id="mp">+</button><input id="msl" type="range" min="30" max="240"><span id="mdots"></span><button data-c="2">2</button><button data-c="3">3</button><button data-c="4">4</button><button data-c="6" title="6/8">6</button><button id="mtap">Tap</button><button id="mgo"></button></div>
 <div id="pages"></div>
 <div id="vf"><input type="range" id="vsl" min="1" max="1" value="1"></div>
</div>
<div id="nt" class="hide"><textarea id="ntx" rows="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit"></textarea><div class="row"><button class="btn" id="nts">Guardar</button><button class="btn d" id="ntd">Borrar</button><button class="btn s" id="ntc">Cerrar</button></div></div>
<div id="sc" class="hide"><div style="display:flex;align-items:center;gap:8px"><b id="sct" style="flex:1"></b><button class="btn s" id="scx">Cerrar</button></div><div id="scl"></div><div class="row"><input type="text" id="scn" placeholder="Nombre (Intro, Solo, Coda…)" style="flex:1;min-width:140px"><button class="btn" id="sca"></button></div></div>
<script src="pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const MAXP=10,DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],ORD=[1,2,3,4,5,6,0],PRI={alta:0,media:1,baja:2};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,obras=[],listas=[],pdfIds=new Set(),tab='est',sub='obras',gf='',se='hoy',wk=0,oq='';
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtF=f=>{const [y,m,d]=f.split('-');return new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short',year:'numeric'})};
const rq=(s,m,f)=>new Promise((ok,no)=>{const r=f(db.transaction(s,m).objectStore(s));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

async function init(){
 db=await new Promise((ok,no)=>{const r=indexedDB.open('estudio',4);r.onupgradeneeded=()=>{const d=r.result,c=(n,o)=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,o)};c('obras',{keyPath:'id',autoIncrement:true});c('pdfs');c('notas',{keyPath:'obra'});c('listas',{keyPath:'id',autoIncrement:true});c('practica',{keyPath:'d'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
 await load();draw();
}
async function load(){
 obras=await rq('obras','readonly',s=>s.getAll());
 pdfIds=new Set(await rq('pdfs','readonly',s=>s.getAllKeys()));
 listas=(await rq('listas','readonly',s=>s.getAll())).map(l=>({...l,obras:l.obras||[]}));
}
const sortO=a=>a.sort((x,y)=>PRI[x.prioridad]-PRI[y.prioridad]||x.titulo.localeCompare(y.titulo));
const PL={alta:'Alta',media:'Media',baja:'Baja'};

function draw(){
 const now=new Date(),hoy=now.getDay(),m=$('#main');
 $('#h1').textContent={est:{hoy:'Hoy',age:'Agenda',pra:'Práctica',lis:'Listas'}[se],org:'Organizar',aju:'Ajustes'}[tab];
 $('#h2').textContent=tab==='est'?now.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
 $('#nav').innerHTML=[['est','♫ Estudiar'],['org','♯ Organizar'],['aju','♭ Ajustes']].map(([k,t])=>`<button class="${k===tab?'on':''}" data-t="${k}">${t}</button>`).join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
 if(tab==='est'){
  m.innerHTML=`<div class="days" style="margin:0 0 12px">${[['hoy','Hoy'],['age','Agenda'],['pra','Práctica'],['lis','Listas']].map(([k,t])=>`<button data-e="${k}" class="${k===se?'on':''}">${t}</button>`).join('')}</div><div id="sb"></div>`;
  m.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{se=b.dataset.e;draw()});
  se==='hoy'?vHoy($('#sb'),hoy):se==='age'?vAgenda($('#sb')):se==='pra'?vPractica($('#sb')):vListas($('#sb'));
 }else if(tab==='org'){
  m.innerHTML=`<div class="days" style="margin:0 0 12px">${[['obras','Obras'],['sem','Semana']].map(([k,t])=>`<button data-s="${k}" class="${k===sub?'on':''}">${t}</button>`).join('')}</div><div id="sb"></div>`;
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sub=b.dataset.s;draw()});
  sub==='obras'?vObras($('#sb')):vSem($('#sb'),hoy);
 }else{
  m.innerHTML=`<p style="color:var(--mu);margin:0 0 6px">Aspecto</p><div class="days" id="tm" style="margin:0 0 16px">${TEMAS.map(([k,t])=>`<button data-m="${k}" class="${(document.documentElement.dataset.t||'folk')===k?'on':''}">${t}</button>`).join('')}</div><p style="color:var(--mu)">Los datos viven solo en este dispositivo. Hacé un respaldo seguido por si el sistema borra la caché.</p><label style="display:flex;gap:10px;align-items:center;color:var(--tx);font-size:16px;margin:0 0 12px"><input type="checkbox" id="rs" ${ls.get('resume')!=='0'?'checked':''} style="width:22px;height:22px"> Abrir cada obra en la última página que viste</label><div class="row"><button class="btn" id="ex">Exportar respaldo</button><button class="btn s" id="im">Importar respaldo</button></div><input type="file" id="imf" class="hide"><p id="msg" style="color:var(--br)"></p>`;
  $('#rs').onchange=e=>ls.set('resume',e.target.checked?'1':'0');$('#tm').querySelectorAll('button').forEach(b=>b.onclick=()=>{tema(b.dataset.m);draw()});$('#ex').onclick=exportar;$('#im').onclick=()=>$('#imf').click();$('#imf').onchange=e=>importar(e.target.files[0]);
 }
}
function vObras(m){
 const gr=[...new Set(obras.map(o=>o.grupo).filter(Boolean))].sort(),sin=obras.filter(o=>o.sin).length;
 const ch=[['','Todas'],...(sin?[['__sin','Sin clasificar ('+sin+')']]:[]),...gr.map(g=>[g,g])];
 if(!ch.some(c=>c[0]===gf))gf='';
 const l=obras.filter(o=>gf===''||(gf==='__sin'?o.sin:o.grupo===gf));
 m.innerHTML=`<div class="row" style="margin-top:0"><button class="btn" id="imp">+ Importar PDFs</button><button class="btn s" id="add">Nueva obra</button></div><input type="file" id="impf" accept="application/pdf" multiple class="hide"><div class="row" style="margin-top:0">${ch.map(([k,t])=>`<button class="btn s" data-g="${esc(k)}" style="padding:8px 12px;font-size:14px;${k===gf?'border-color:var(--br);color:var(--br)':''}">${esc(t)}</button>`).join('')}</div><select id="ord" style="margin-bottom:8px">${[['pri','Orden: por prioridad'],['az','Orden: de la A a la Z'],['rec','Orden: más recientes primero']].map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select><input type="text" id="oq" placeholder="Buscar por título o compositor" value="${esc(oq)}"><p id="imsg" style="color:var(--br);margin:8px 0"></p><div id="lst"></div>`;
 const pl=()=>{const k=nz(oq),r=l.filter(o=>!k||nz(o.titulo+' '+o.compositor+' '+(o.grupo||'')).includes(k));$('#lst').innerHTML=r.length?ordO([...r]).map(o=>card(o,true)).join(''):'<div class="empty">No hay obras en esta vista.</div>';bindCards($('#lst'))};
 pl();$('#oq').oninput=e=>{oq=e.target.value;pl()};
 m.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gf=b.dataset.g;draw()});
 $('#ord').value=ls.get('orden')||'pri';$('#ord').onchange=e=>{ls.set('orden',e.target.value);pl()};$('#add').onclick=()=>form();
 $('#imp').onclick=()=>$('#impf').click();
 $('#impf').onchange=async e=>{
  const fs=[...e.target.files],bad=[];let ok=0;
  for(const f of fs){
   $('#imsg').textContent=`Importando ${ok+bad.length+1} de ${fs.length}…`;
   try{
    const d=await pdfjsLib.getDocument({data:await f.arrayBuffer(),isEvalSupported:false}).promise;
    if(d.numPages>MAXP){bad.push(`${f.name} (${d.numPages} págs.)`);continue}
    const id=await rq('obras','readwrite',s=>s.add({titulo:f.name.replace(/\.pdf$/i,''),compositor:'',notas:'',prioridad:'media',dias:[],grupo:'',sin:true}));
    await rq('pdfs','readwrite',s=>s.put(f,id));ok++;
   }catch(x){bad.push(f.name+' (no se pudo leer)')}
  }
  await load();if(ok)gf='__sin';draw();
  $('#imsg').textContent=`${ok} importada(s).`+(bad.length?` No se importaron: ${bad.join(', ')}. El máximo es ${MAXP} páginas por PDF.`:'');
 };
}
function vSem(m,hoy){
 m.innerHTML=obras.length?sortO([...obras]).map(o=>`<div class="card" style="display:block"><div style="display:flex;gap:12px"><span class="dot ${o.prioridad}"></span><div><div class="tt">${esc(o.titulo)}</div><small>${esc(o.compositor)} · Prioridad ${PL[o.prioridad]}</small></div></div><div class="days">${ORD.map(d=>`<button data-o="${o.id}" data-d="${d}" class="${(o.dias||[]).includes(d)?'on':''} ${d===hoy?'hoy':''}">${DIAS[d]}</button>`).join('')}</div></div>`).join(''):'<div class="empty">Cargá obras en la pestaña Obras para organizarlas.</div>';
 m.querySelectorAll('.days button').forEach(b=>b.onclick=async()=>{
  const o=obras.find(x=>x.id==b.dataset.o),d=+b.dataset.d;o.dias=o.dias||[];
  o.dias=o.dias.includes(d)?o.dias.filter(x=>x!==d):[...o.dias,d];
  await rq('obras','readwrite',s=>s.put(o));b.classList.toggle('on')});
}
function card(o,ed){
 return `<div class="card" data-id="${o.id}"><span class="dot ${o.prioridad}"></span><div style="flex:1"><div class="tt">${esc(o.titulo)}</div><small>${esc(o.compositor)}${o.compositor?' · ':''}${PL[o.prioridad]}${o.grupo?' · '+esc(o.grupo):''}${o.sin?' · sin clasificar':''}${pdfIds.has(o.id)?'':' · sin PDF'}</small>${o.notas?`<small style="margin-top:4px;color:var(--tx)">${esc(o.notas)}</small>`:''}</div>${ed?'<button class="btn s ed" style="padding:8px 12px;font-size:14px">Editar</button>':''}</div>`;
}
function bindCards(m){
 m.querySelectorAll('.card[data-id]').forEach(c=>{
  const o=obras.find(x=>x.id==c.dataset.id),b=c.querySelector('.ed');
  if(b)b.onclick=e=>{e.stopPropagation();form(o)};
  c.onclick=()=>{if(pdfIds.has(o.id))abrir(o);else form(o)};
 });
}
function form(o){
 const e=!!o;o=o||{prioridad:'media',dias:[]};
 const M=$('#modal');M.classList.remove('hide');
 M.innerHTML=`<h2 style="margin:0">${e?'Editar obra':'Nueva obra'}</h2>
 <label>Título</label><input type="text" id="f1" value="${esc(o.titulo)}">

async function vPractica(m){
 await pguardar();const all=await rq('practica','readonly',s=>s.getAll());if(!m.isConnected)return;
 const now=new Date(),h=ymd(now),tot=r=>Object.values(r.o).reduce((a,b)=>a+b,0),mp={};all.forEach(r=>mp[r.d]=tot(r));
 const ok=d=>(mp[d]||0)>=300,dd=new Date(now);if(!ok(ymd(dd)))dd.setDate(dd.getDate()-1);
 let rach=0;while(ok(ymd(dd))){rach++;dd.setDate(dd.getDate()-1)}
 let best=0,cur=0,prev=null;for(const d of Object.keys(mp).filter(ok).sort()){if(prev){const [y,mo,da]=prev.split('-');cur=ymd(new Date(+y,mo-1,+da+1))===d?cur+1:1}else cur=1;best=Math.max(best,cur);prev=d}
 const lun=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)),dias=ORD.map((d,i)=>{const f=new Date(lun.getFullYear(),lun.getMonth(),lun.getDate()+i),k=ymd(f);return{d,k,s:mp[k]||0}});
 const mx=Math.max(600,...dias.map(x=>x.s)),sem=dias.reduce((a,x)=>a+x.s,0),po={};
 all.filter(r=>dias.some(x=>x.k===r.d)).forEach(r=>Object.entries(r.o).forEach(([i,v])=>po[i]=(po[i]||0)+v));
 const top=Object.entries(po).map(([i,v])=>[obras.find(o=>o.id==i),v]).filter(x=>x[0]).sort((a,b)=>b[1]-a[1]).slice(0,5),mn=v=>Math.round(v/60);
 m.innerHTML=`<div class="card" style="display:block;text-align:center"><div style="font-size:44px;font-family:Georgia,serif;color:var(--br);line-height:1.1">♫ ${rach}</div><div class="tt">${rach===1?'día seguido':'días seguidos'} de práctica</div><small>Mejor racha: ${best} · Hoy: ${mn(mp[h]||0)} min · Esta semana: ${mn(sem)} min</small></div>
 <h2 style="font-size:18px;margin:14px 0 8px">Esta semana (minutos)</h2><div class="card" style="display:flex;gap:4px;align-items:flex-end">${dias.map(x=>`<div style="flex:1;text-align:center"><div style="height:80px;display:flex;align-items:flex-end;justify-content:center"><div style="width:70%;height:${Math.max(3,Math.round(x.s/mx*80))}px;background:${x.s>=300?'var(--br)':'var(--ln)'};border-radius:4px 4px 0 0"></div></div><small style="display:block;${x.k===h?'color:var(--br);font-weight:700':''}">${DIAS[x.d]}</small><small style="display:block;color:var(--tx)">${mn(x.s)}</small></div>`).join('')}</div>
 <h2 style="font-size:18px;margin:14px 0 8px">Lo más estudiado esta semana</h2>${top.length?top.map(([o,v])=>`<div class="card" style="align-items:center"><span class="dot ${o.prioridad}"></span><div style="flex:1" class="tt">${esc(o.titulo)}</div><b>${mn(v)} min</b></div>`).join(''):'<div class="empty" style="padding:14px 10px">Todavía no hay práctica registrada esta semana.<br>Se cuenta sola mientras tenés una partitura abierta.</div>'}
 <small style="color:var(--mu);display:block;margin-top:10px">Un día suma a la racha desde los 5 minutos con la partitura abierta. El tiempo se pausa tras 10 minutos sin tocar la pantalla, salvo que el metrónomo esté sonando.</small>`;
}

function capa(w,pi,cw,ch,fw,fh,ox,oy){
 const d=V.nt.p[pi]||(V.nt.p[pi]={s:[],n:[]}),o=document.createElement('canvas'),R=2;
 o.className='ov';o.width=cw*R;o.height=ch*R;o.style.width=cw+'px';o.style.height=ch+'px';w.appendChild(o);
 const x=o.getContext('2d');
 const redib=()=>{x.setTransform(R,0,0,R,0,0);x.clearRect(0,0,cw,ch);if(V.hm)return;
  for(const s of d.s){x.beginPath();x.strokeStyle=s.c;x.globalAlpha=s.h?.35:1;x.lineWidth=s.w*fw;x.lineCap=s.h?'butt':'round';x.lineJoin='round';
   s.q.forEach((p,i)=>i?x.lineTo(p[0]*fw-ox,p[1]*fh-oy):x.moveTo(p[0]*fw-ox,p[1]*fh-oy));
   if(s.q.length===1)x.lineTo(s.q[0][0]*fw-ox+.1,s.q[0][1]*fh-oy);x.stroke()}
  x.globalAlpha=1};
 redib();
 if(!V.hm)d.n.forEach(n=>{const b=document.createElement('button');b.className='pin';b.style.left=n.x*fw-ox+'px';b.style.top=n.y*fh-oy+'px';b.onclick=e=>{e.stopPropagation();abrirNt(d,n,o)};w.appendChild(b)});
 o._fh=fh;o._oy=oy;
 const pos=e=>{const r=o.getBoundingClientRect();return[(e.clientX-r.left+ox)/fw,(e.clientY-r.top+oy)/fh]};
 const borrar=q=>{const k=d.s.length;d.s=d.s.filter(s=>!s.q.some(p=>Math.hypot((p[0]-q[0])*fw,(p[1]-q[1])*fh)<14));if(d.s.length!==k)redib()};
 let cur=null;

  if(!V.an||(e.pointerType==='touch'&&!V.dedo))return;e.preventDefault();o.setPointerCapture(e.pointerId);const q=pos(e);
  if(V.tl==='n'){const n={x:q[0],y:q[1],t:''};d.n.push(n);abrirNt(d,n,o);return}
  if(V.tl==='g'){borrar(q);cur='g';return}
  cur={c:V.col,h:V.tl==='h',w:(V.tl==='h'?[.012,.022]:[.0025,.005])[V.gr],q:[q]};d.s.push(cur);redib();
 };

}
/* Respaldo */
const MAGIC=new TextEncoder().encode('ESTM4'),MB=n=>(n/1048576).toFixed(1)+' MB';
async function exportar(){
 try{
  const nt=await rq('notas','readonly',s=>s.getAll()),pr=await rq('practica','readonly',s=>s.getAll()),fl=[],parts=[];
  for(const o of obras){const b=await rq('pdfs','readonly',s=>s.get(o.id));if(b){fl.push({id:o.id,n:b.size});parts.push(b)}}
  const h=new TextEncoder().encode(JSON.stringify({version:5,obras,notas:nt,listas,practica:pr,files:fl})),len=new Uint8Array(4);new DataView(len.buffer).setUint32(0,h.length);
  const blob=new Blob([MAGIC,len,h,...parts],{type:'application/octet-stream'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='respaldo-estudio-'+new Date().toISOString().slice(0,10)+'.estudio';a.click();
  $('#msg').textContent='Respaldo exportado ('+obras.length+' obras, '+MB(blob.size)+').';
 }catch(e){$('#msg').textContent='No se pudo exportar el respaldo: '+(e&&e.message||e)}
}
async function importar(f){
 if(!f||!confirm('Importar reemplaza todo lo que hay ahora en la app. ¿Seguir?'))return;
 let d,src=new Map();
 try{
  const nuevo=String.fromCharCode(...new Uint8Array(await f.slice(0,5).arrayBuffer()))==='ESTM4';
  if(nuevo){
   const n=new DataView(await f.slice(5,9).arrayBuffer()).getUint32(0);
   d=JSON.parse(new TextDecoder().decode(await f.slice(9,9+n).arrayBuffer()));
   let off=9+n;for(const x of d.files){if(!(x.n>=0))throw 0;src.set(x.id,[off,x.n]);off+=x.n}
   if(off>f.size)throw 0;
  }else{
   d=JSON.parse(await f.text());
   if(!d||typeof d.pdfs!=='object'||!d.pdfs)throw 0;
   for(const o of d.obras)if(d.pdfs[o.id])src.set(o.id,await0(d.pdfs[o.id]));
  }
  if(!d||!Array.isArray(d.obras)||(d.listas&&!Array.isArray(d.listas))||(d.notas&&!Array.isArray(d.notas))||(d.practica&&!Array.isArray(d.practica)))throw 0;
 }catch(e){$('#msg').textContent='No se pudo importar: el archivo no es un respaldo válido. No se cambió nada.';return}
 try{
  for(const s of ['obras','pdfs','notas','listas','practica'])await rq(s,'readwrite',x=>x.clear());
  for(const o of d.obras){
   await rq('obras','readwrite',s=>s.put(o));const v=src.get(o.id);
   if(v){const b=Array.isArray(v)?new Blob([await f.slice(v[0],v[0]+v[1]).arrayBuffer()],{type:'application/pdf'}):v;await rq('pdfs','readwrite',s=>s.put(b,o.id))}
  }
  for(const n of d.notas||[])await rq('notas','readwrite',s=>s.put(n));
  for(const l of d.listas||[])await rq('listas','readwrite',s=>s.put(l));
  for(const x of d.practica||[])await rq('practica','readwrite',s=>s.put(x));
 }catch(e){$('#msg').textContent='La importación se cortó a la mitad: '+(e&&e.message||e)+'. Volvé a intentarlo con el mismo archivo.';await load();draw();return}
 await load();draw();$('#msg').textContent='Respaldo importado ('+d.obras.length+' obras).';
}
const await0=u=>{const [h,b]=u.split(','),m=h.match(/:(.*?);/)[1],bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})};
function aviso(t){
 let d=$('#err');if(!d){d=document.createElement('div');d.id='err';d.style.cssText='position:fixed;left:8px;right:8px;bottom:70px;z-index:99;background:#5a1d17;color:#fff;border:1px solid var(--al);border-radius:10px;padding:12px;font-size:14px';d.onclick=()=>d.remove();document.body.appendChild(d)}
 d.textContent='Algo falló: '+t+'. (Tocá para cerrar.) Si se repite, hacé un respaldo y mandame una captura de este mensaje.';
}
addEventListener('error',e=>aviso(e.message||'error'));
addEventListener('unhandledrejection',e=>aviso(String(e.reason&&e.reason.message||e.reason||'error desconocido')));
init().catch(e=>aviso('no se pudo abrir el almacenamiento ('+(e&&e.message||e)+')'));
